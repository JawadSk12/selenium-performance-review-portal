# ===================================================================
# Performance Review Portal - PostgreSQL Configuration
# ===================================================================

# ----------------------------
# Server
# ----------------------------
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# ----------------------------
# PostgreSQL Database
# ----------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:performance_review}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Jawadsk@12}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------
# Hikari Connection Pool
# ----------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# ----------------------------
# JPA / Hibernate
# ----------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ----------------------------
# Thymeleaf
# ----------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ----------------------------
# Logging
# ----------------------------
logging.level.com.review.portal=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE