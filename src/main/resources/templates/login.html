<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Employee Performance Review Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Login Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-badge">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">Employee Portal</h3>
            <p class="text-muted small">Sign in to access your performance reviews and dashboard</p>
        </div>

        <!-- Alert Messages -->
        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center py-2 px-3 mb-3 small" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-6"></i>
            <span th:text="${errorMessage}">Invalid credentials.</span>
        </div>

        <div th:if="${logoutMessage}" class="alert alert-success d-flex align-items-center py-2 px-3 mb-3 small" role="alert">
            <i class="bi bi-check-circle-fill me-2 fs-6"></i>
            <span th:text="${logoutMessage}">You have been logged out.</span>
        </div>

        <div th:if="${warningMessage}" class="alert alert-warning d-flex align-items-center py-2 px-3 mb-3 small" role="alert">
            <i class="bi bi-shield-exclamation me-2 fs-6"></i>
            <span th:text="${warningMessage}">Please log in.</span>
        </div>

        <form th:action="@{/login}" method="post" th:object="${loginRequest}" id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold small text-secondary">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" name="email" th:field="*{email}" class="form-control border-start-0 ps-0" placeholder="e.g. jawad@gmail.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-semibold small text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                    <input type="password" id="password" name="password" th:field="*{password}" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check small">
                    <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe" th:field="*{rememberMe}">
                    <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
                </div>
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary-gradient w-100 mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>

        <div class="demo-credentials-box mt-3">
            <div class="fw-semibold text-dark mb-1"><i class="bi bi-info-circle me-1"></i> Demo Credentials:</div>
            <div class="text-muted">Email: <span class="fw-medium text-dark">jawad@gmail.com</span></div>
            <div class="text-muted">Password: <span class="fw-medium text-dark">1234</span></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
