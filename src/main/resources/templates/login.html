<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Employee Performance Review Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Global & Login Stylesheets -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <!-- ── Brand Header ─────────────────────────────────────────── -->
        <div class="text-center mb-4">
            <div class="brand-badge" aria-hidden="true">
                <i class="bi bi-shield-check"></i>
            </div>
            <div class="portal-tag">
                <span class="status-dot status-dot-emerald" aria-hidden="true"></span>
                Employee Portal
            </div>
            <h1 class="h4 fw-bold mb-1" style="letter-spacing:-.02em;">Employee Sign In</h1>
            <p class="text-muted small mb-0">Access your performance evaluations, milestones &amp; history</p>
        </div>

        <!-- ── Flash Alerts ─────────────────────────────────────────── -->
        <div th:if="${errorMessage}"
             class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 mb-3 small"
             role="alert">
            <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
            <span th:text="${errorMessage}">Invalid credentials.</span>
        </div>

        <div th:if="${logoutMessage}"
             class="alert alert-success d-flex align-items-center gap-2 py-2 px-3 mb-3 small"
             role="alert">
            <i class="bi bi-check-circle-fill flex-shrink-0"></i>
            <span th:text="${logoutMessage}">You have been logged out.</span>
        </div>

        <div th:if="${warningMessage}"
             class="alert alert-warning d-flex align-items-center gap-2 py-2 px-3 mb-3 small"
             role="alert">
            <i class="bi bi-shield-exclamation flex-shrink-0"></i>
            <span th:text="${warningMessage}">Please log in.</span>
        </div>

        <!-- ── Login Form ────────────────────────────────────────────── -->
        <form th:action="@{/login}" method="post" th:object="${loginRequest}" id="loginForm" novalidate>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold small text-secondary">Work Email Address</label>
                <div class="input-group input-group-custom">
                    <span class="input-group-text" aria-hidden="true"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" name="email" th:field="*{email}"
                           class="form-control"
                           placeholder="you@company.com"
                           required autocomplete="email">
                </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold small text-secondary">Password</label>
                <div class="input-group input-group-custom">
                    <span class="input-group-text" aria-hidden="true"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" name="password" th:field="*{password}"
                           class="form-control"
                           placeholder="••••••••"
                           required autocomplete="current-password">
                    <button type="button"
                            class="btn-pw-toggle"
                            data-target="password"
                            aria-label="Show password">
                        <i class="bi bi-eye-slash" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <!-- Remember Me & Portal Switch -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check small">
                    <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe" th:field="*{rememberMe}">
                    <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
                </div>
                <a th:href="@{/manager-login}" class="portal-switch-link">
                    <i class="bi bi-briefcase-fill" aria-hidden="true"></i>
                    Manager Login
                </a>
            </div>

            <!-- Submit -->
            <button type="submit" id="loginBtn"
                    class="btn btn-primary-gradient w-100 mb-3 justify-content-center">
                <span>Sign In to Dashboard</span>
                <i class="bi bi-arrow-right" aria-hidden="true"></i>
            </button>

        </form>

        <!-- ── Demo Credentials ──────────────────────────────────────── -->
        <div class="demo-credentials-box mt-2">
            <div>
                <div class="fw-semibold text-dark mb-1 d-flex align-items-center gap-1" style="font-size:.82rem;">
                    <i class="bi bi-info-circle-fill text-primary" aria-hidden="true"></i>
                    <span>Employee Demo Account:</span>
                </div>
                <div class="text-muted d-flex gap-2 flex-wrap" style="font-size:.8rem;">
                    <span>Email: <span class="credential-pill">jawad@gmail.com</span></span>
                    <span>Pass: <span class="credential-pill">1234</span></span>
                </div>
            </div>
            <button type="button"
                    class="btn btn-sm btn-light border py-1 px-2 text-muted"
                    onclick="document.getElementById('email').value='jawad@gmail.com'; document.getElementById('password').value='1234';"
                    title="Autofill demo credentials"
                    aria-label="Autofill demo credentials">
                <i class="bi bi-lightning-charge-fill text-warning" aria-hidden="true"></i>
            </button>
        </div>

    </div><!-- /.login-card -->
</div><!-- /.login-wrapper -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}" src="/js/main.js"></script>
</body>
</html>
