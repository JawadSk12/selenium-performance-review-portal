<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Login - Executive Review Workspace</title>
    <!-- Google Fonts Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Manager Login Glassmorphism Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <link rel="stylesheet" th:href="@{/css/manager-login.css}" href="/css/manager-login.css">
</head>
<body>

<div class="manager-login-wrapper">
    <div class="glass-login-card">
        <div class="text-center mb-4">
            <div class="manager-brand-badge">
                <i class="bi bi-briefcase-fill"></i>
            </div>
            <div class="executive-tag">
                <span class="status-dot status-dot-amber me-1"></span> Executive Workspace
            </div>
            <h2 class="h4 fw-bold text-white mb-1">Manager Sign In</h2>
            <p class="text-secondary small mb-0">Evaluate employee submissions, score competencies &amp; manage approvals</p>
        </div>

        <!-- Alert Notifications -->
        <div th:if="${errorMessage}" class="alert alert-glass-danger d-flex align-items-center py-2 px-3 mb-3 small rounded-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-6 flex-shrink-0"></i>
            <span th:text="${errorMessage}">Invalid credentials.</span>
        </div>

        <div th:if="${logoutMessage}" class="alert alert-glass-success d-flex align-items-center py-2 px-3 mb-3 small rounded-3" role="alert">
            <i class="bi bi-check-circle-fill me-2 fs-6 flex-shrink-0"></i>
            <span th:text="${logoutMessage}">Logged out successfully.</span>
        </div>

        <div th:if="${warningMessage}" class="alert alert-glass-warning d-flex align-items-center py-2 px-3 mb-3 small rounded-3" role="alert">
            <i class="bi bi-shield-lock-fill me-2 fs-6 flex-shrink-0"></i>
            <span th:text="${warningMessage}">Please authenticate with manager credentials.</span>
        </div>

        <form th:action="@{/manager/login}" method="post" th:object="${loginRequest}" id="managerLoginForm">
            <!-- Email Field -->
            <div class="mb-3">
                <label for="email" class="form-label">Manager Work Email</label>
                <div class="input-group glass-input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" name="email" th:field="*{email}" class="form-control text-white"
                           placeholder="manager@gmail.com" required autocomplete="email">
                </div>
            </div>

            <!-- Password Field -->
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group glass-input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" name="password" th:field="*{password}" class="form-control text-white"
                           placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <!-- Remember Me Field -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check small">
                    <input type="checkbox" class="form-check-input bg-dark border-secondary" id="rememberMe" name="rememberMe" th:field="*{rememberMe}">
                    <label class="form-check-label text-secondary" for="rememberMe">Remember me</label>
                </div>
                <a th:href="@{/login}" class="text-decoration-none text-info small d-inline-flex align-items-center gap-1">
                    <span>Employee Portal</span>
                    <i class="bi bi-arrow-right"></i>
                </a>
            </div>

            <!-- Login Button -->
            <button type="submit" id="loginBtn" class="btn btn-manager-gradient w-100 mb-3 d-flex align-items-center justify-content-center gap-2">
                <span>Access Executive Workspace</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <!-- Demo Credentials Box -->
        <div class="demo-box-dark mt-3 d-flex justify-content-between align-items-center">
            <div>
                <div class="fw-semibold mb-1 text-info d-flex align-items-center gap-1">
                    <i class="bi bi-key-fill"></i>
                    <span>Manager Demo Access:</span>
                </div>
                <div class="text-secondary small d-flex gap-2">
                    <span>Email: <span class="badge bg-dark border border-secondary text-white">manager@gmail.com</span></span>
                    <span>Pass: <span class="badge bg-dark border border-secondary text-white">1234</span></span>
                </div>
            </div>
            <button type="button" class="btn btn-sm btn-outline-secondary py-1 px-2 text-info" onclick="document.getElementById('email').value='manager@gmail.com'; document.getElementById('password').value='1234';" title="Autofill Manager Credentials">
                <i class="bi bi-lightning-charge-fill text-warning"></i>
            </button>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
