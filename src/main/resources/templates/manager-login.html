<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Login - Executive Review Workspace</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Manager Login Glassmorphism Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/manager-login.css}" href="/css/manager-login.css">
</head>
<body>

<div class="manager-login-wrapper">
    <div class="glass-login-card">
        <div class="text-center mb-4">
            <div class="manager-brand-badge">
                <i class="bi bi-briefcase-fill"></i>
            </div>
            <div class="executive-tag">Executive Portal</div>
            <h2 class="h4 fw-bold text-white mb-1">Manager Workspace</h2>
            <p class="text-secondary small mb-0">Sign in to evaluate employee reviews and manage approvals</p>
        </div>

        <!-- Alert Notifications -->
        <div th:if="${errorMessage}" class="alert alert-glass-danger d-flex align-items-center py-2 px-3 mb-3 small" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-6"></i>
            <span th:text="${errorMessage}">Invalid credentials.</span>
        </div>

        <div th:if="${logoutMessage}" class="alert alert-glass-success d-flex align-items-center py-2 px-3 mb-3 small" role="alert">
            <i class="bi bi-check-circle-fill me-2 fs-6"></i>
            <span th:text="${logoutMessage}">Logged out successfully.</span>
        </div>

        <div th:if="${warningMessage}" class="alert alert-glass-warning d-flex align-items-center py-2 px-3 mb-3 small" role="alert">
            <i class="bi bi-shield-lock-fill me-2 fs-6"></i>
            <span th:text="${warningMessage}">Please authenticate with manager credentials.</span>
        </div>

        <form th:action="@{/manager/login}" method="post" th:object="${loginRequest}" id="managerLoginForm">
            <!-- Email Field -->
            <div class="mb-3">
                <label for="email" class="form-label">Manager Email</label>
                <div class="input-group glass-input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" name="email" th:field="*{email}" class="form-control"
                           placeholder="manager@company.com" required autocomplete="email">
                </div>
            </div>

            <!-- Password Field -->
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group glass-input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" name="password" th:field="*{password}" class="form-control"
                           placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <!-- Remember Me Field -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check small">
                    <input type="checkbox" class="form-check-input bg-dark border-secondary" id="rememberMe" name="rememberMe" th:field="*{rememberMe}">
                    <label class="form-check-label text-secondary" for="rememberMe">Remember me</label>
                </div>
                <a th:href="@{/login}" class="text-decoration-none text-info small">Employee Portal <i class="bi bi-arrow-right"></i></a>
            </div>

            <!-- Login Button -->
            <button type="submit" id="loginBtn" class="btn btn-manager-gradient w-100 mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Login
            </button>
        </form>

        <!-- Demo Credentials Box -->
        <div class="demo-box-dark mt-3">
            <div class="fw-semibold mb-1"><i class="bi bi-key-fill text-info me-1"></i> <strong>Manager Demo Access:</strong></div>
            <div class="text-secondary small">Email: <span class="text-white">manager@gmail.com</span></div>
            <div class="text-secondary small">Password: <span class="text-white">1234</span></div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
