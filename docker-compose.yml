services:

  postgres:
    image: postgres:16
    container_name: performance-review-postgres
    environment:
      POSTGRES_DB: performance_review
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Jawadsk@12
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: performance-review-portal:week11
    container_name: performance-review-app
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: performance_review
      DB_USERNAME: postgres
      DB_PASSWORD: Jawadsk@12
      SERVER_PORT: 8080
    ports:
      - "8082:8080"

volumes:
  postgres_data: